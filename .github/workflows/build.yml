name: Colonel Fried Chicken POS V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms android --project-name colonel_pos_v4 app

      - name: Write pubspec.yaml
        run: |
          cat > app/pubspec.yaml <<'YAML'
          name: colonel_pos_v4
          description: Colonel Fried Chicken POS
          publish_to: "none"
          version: 4.0.0+1

          environment:
            sdk: ">=3.7.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.5.3
            image_picker: ^1.1.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          YAML

      - name: Write main.dart
        run: |
          cat > app/lib/main.dart <<'DART'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          const red = Color(0xFFD71920);
          const darkRed = Color(0xFF9E1117);

          String rp(int n) {
            final s = n.toString();
            final out = StringBuffer();
            for (int i = 0; i < s.length; i++) {
              if (i > 0 && (s.length - i) % 3 == 0) out.write('.');
              out.write(s[i]);
            }
            return 'Rp$out';
          }

          class Product {
            String name;
            String category;
            int price;
            bool active;
            Product(this.name, this.category, this.price, {this.active = true});

            Map<String, dynamic> toJson() => {
              'name': name,
              'category': category,
              'price': price,
              'active': active
            };

            factory Product.fromJson(Map<String, dynamic> j) => Product(
              j['name'],
              j['category'],
              j['price'],
              active: j['active'] ?? true,
            );
          }

          class Sale {
            final String no;
            final String time;
            final int total;
            final String payment;
            Sale(this.no, this.time, this.total, this.payment);

            Map<String, dynamic> toJson() => {
              'no': no,
              'time': time,
              'total': total,
              'payment': payment
            };

            factory Sale.fromJson(Map<String, dynamic> j) =>
                Sale(j['no'], j['time'], j['total'], j['payment']);
          }

          final defaults = <Product>[
            Product('Dada', 'Ayam', 12000),
            Product('Paha Atas', 'Ayam', 12000),
            Product('Paha Bawah', 'Ayam', 9000),
            Product('Sayap', 'Ayam', 9000),
            Product('Paket Dada', 'Paket', 15500),
            Product('Paket Paha Atas', 'Paket', 15500),
            Product('Paket Paha Bawah', 'Paket', 12500),
            Product('Paket Sayap', 'Paket', 12500),
            Product('Sambal Geprek', 'Tambahan', 3000),
            Product('Kentang Goreng', 'Tambahan', 8000),
            Product('Air Mineral', 'Minuman', 4000),
            Product('Es Teh', 'Minuman', 4000),
          ];

          Future<void> saveProducts(List<Product> p) async {
            final sp = await SharedPreferences.getInstance();
            await sp.setString(
              'products',
              jsonEncode(p.map((e) => e.toJson()).toList()),
            );
          }

          Future<List<Product>> loadProducts() async {
            final sp = await SharedPreferences.getInstance();
            final raw = sp.getString('products');
            if (raw == null) {
              await saveProducts(defaults);
              return defaults.map((e) => Product(e.name, e.category, e.price)).toList();
            }
            return (jsonDecode(raw) as List)
                .map((e) => Product.fromJson(e))
                .toList();
          }

          Future<List<Sale>> loadSales() async {
            final sp = await SharedPreferences.getInstance();
            final raw = sp.getString('sales');
            if (raw == null) return [];
            return (jsonDecode(raw) as List)
                .map((e) => Sale.fromJson(e))
                .toList();
          }

          Future<void> saveSale(Sale s) async {
            final list = await loadSales();
            list.insert(0, s);
            final sp = await SharedPreferences.getInstance();
            await sp.setString(
              'sales',
              jsonEncode(list.map((e) => e.toJson()).toList()),
            );
          }

          void main() {
            runApp(const ColonelApp());
          }

          class ColonelApp extends StatelessWidget {
            const ColonelApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Colonel Fried Chicken POS',
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: red),
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFFF7F7F7),
                ),
                home: const LoginPage(),
              );
            }
          }

          class LoginPage extends StatefulWidget {
            const LoginPage({super.key});
            @override
            State<LoginPage> createState() => _LoginPageState();
          }

          class _LoginPageState extends State<LoginPage> {
            final user = TextEditingController();
            final pass = TextEditingController();

            void login() {
              if ((user.text == 'admin' && pass.text == '1234') ||
                  (user.text == 'kasir' && pass.text == '1234')) {
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(
                    builder: (_) => HomePage(role: user.text),
                  ),
                );
              } else {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('Username atau password salah')),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Column(
                      children: [
                        const Icon(Icons.restaurant,
                            size: 80, color: red),
                        const SizedBox(height: 12),
                        const Text(
                          'COLONEL FRIED CHICKEN',
                          style: TextStyle(
                            fontSize: 23,
                            fontWeight: FontWeight.bold,
                            color: red,
                          ),
                        ),
                        const Text('POINT OF SALE',
                            style: TextStyle(fontWeight: FontWeight.w600)),
                        const SizedBox(height: 35),
                        TextField(
                          controller: user,
                          decoration: const InputDecoration(
                            labelText: 'Username',
                            prefixIcon: Icon(Icons.person),
                            border: OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 15),
                        TextField(
                          controller: pass,
                          obscureText: true,
                          decoration: const InputDecoration(
                            labelText: 'Password',
                            prefixIcon: Icon(Icons.lock),
                            border: OutlineInputBorder(),
                          ),
                        ),
                        const SizedBox(height: 20),
                        SizedBox(
                          width: double.infinity,
                          height: 52,
                          child: ElevatedButton(
                            onPressed: login,
                            style: ElevatedButton.styleFrom(
                              backgroundColor: red,
                              foregroundColor: Colors.white,
                            ),
                            child: const Text('MASUK'),
                          ),
                        ),
                        const SizedBox(height: 15),
                        const Text('Admin: admin / 1234'),
                        const Text('Kasir: kasir / 1234'),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class HomePage extends StatefulWidget {
            final String role;
            const HomePage({super.key, required this.role});
            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            int index = 0;

            @override
            Widget build(BuildContext context) {
              final pages = [
                DashboardPage(),
                PosPage(),
                ReportPage(),
                SettingsPage(role: widget.role),
              ];

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: red,
                  foregroundColor: Colors.white,
                  title: const Text('Colonel Fried Chicken'),
                ),
                body: pages[index],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: index,
                  onDestinationSelected: (i) => setState(() => index = i),
                  destinations: const [
                    NavigationDestination(
                        icon: Icon(Icons.dashboard), label: 'Dashboard'),
                    NavigationDestination(
                        icon: Icon(Icons.point_of_sale), label: 'Transaksi'),
                    NavigationDestination(
                        icon: Icon(Icons.receipt_long), label: 'Laporan'),
                    NavigationDestination(
                        icon: Icon(Icons.settings), label: 'Pengaturan'),
                  ],
                ),
              );
            }
          }

          class DashboardPage extends StatelessWidget {
            DashboardPage({super.key});

            @override
            Widget build(BuildContext context) {
              return FutureBuilder<List<Sale>>(
                future: loadSales(),
                builder: (context, snap) {
                  final sales = snap.data ?? [];
                  final today = DateTime.now();
                  final todaySales = sales.where((s) {
                    final d = DateTime.tryParse(s.time);
                    return d != null &&
                        d.year == today.year &&
                        d.month == today.month &&
                        d.day == today.day;
                  }).toList();
                  final omzet = todaySales.fold<int>(
                      0, (sum, s) => sum + s.total);

                  return ListView(
                    padding: const EdgeInsets.all(16),
                    children: [
                      const Text('Dashboard',
                          style: TextStyle(
                              fontSize: 25, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 15),
                      Row(
                        children: [
                          Expanded(
                            child: infoCard(
                              'Omzet Hari Ini',
                              rp(omzet),
                              Icons.payments,
                            ),
                          ),
                          const SizedBox(width: 10),
                          Expanded(
                            child: infoCard(
                              'Transaksi',
                              '${todaySales.length}',
                              Icons.receipt,
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 20),
                      const Text('Transaksi Terbaru',
                          style: TextStyle(
                              fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 8),
                      ...sales.take(8).map(
                        (s) => Card(
                          child: ListTile(
                            leading: const CircleAvatar(
                              backgroundColor: red,
                              child: Icon(Icons.receipt, color: Colors.white),
                            ),
                            title: Text(s.no),
                            subtitle: Text('${s.time} • ${s.payment}'),
                            trailing: Text(rp(s.total)),
                          ),
                        ),
                      ),
                    ],
                  );
                },
              );
            }

            Widget infoCard(String title, String value, IconData icon) {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(18),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Icon(icon, color: red),
                      const SizedBox(height: 12),
                      Text(title),
                      const SizedBox(height: 5),
                      Text(value,
                          style: const TextStyle(
                              fontSize: 19, fontWeight: FontWeight.bold)),
                    ],
                  ),
                ),
              );
            }
          }

          class PosPage extends StatefulWidget {
            const PosPage({super.key});
            @override
            State<PosPage> createState() => _PosPageState();
          }

          class _PosPageState extends State<PosPage> {
            List<Product> products = [];
            final Map<String, int> cart = {};
            String category = 'Semua';

            @override
            void initState() {
              super.initState();
              loadProducts().then((v) => setState(() => products = v));
            }

            int get total => cart.entries.fold(0, (sum, e) {
              final p = products.firstWhere((p) => p.name == e.key);
              return sum + p.price * e.value;
            });

            void add(Product p) {
              setState(() => cart[p.name] = (cart[p.name] ?? 0) + 1);
            }

            Future<void> checkout() async {
              if (cart.isEmpty) return;
              String payment = 'Tunai';
              final cash = TextEditingController();

              final result = await showDialog<String>(
                context: context,
                builder: (c) => AlertDialog(
                  title: const Text('Pembayaran'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text('Total: ${rp(total)}',
                          style: const TextStyle(
                              fontWeight: FontWeight.bold, fontSize: 18)),
                      const SizedBox(height: 15),
                      DropdownButtonFormField<String>(
                        value: payment,
                        items: const [
                          DropdownMenuItem(
                              value: 'Tunai', child: Text('Tunai')),
                          DropdownMenuItem(
                              value: 'QRIS', child: Text('QRIS')),
                        ],
                        onChanged: (v) => payment = v!,
                        decoration:
                            const InputDecoration(labelText: 'Metode'),
                      ),
                      const SizedBox(height: 10),
                      TextField(
                        controller: cash,
                        keyboardType: TextInputType.number,
                        decoration: const InputDecoration(
                          labelText: 'Uang Tunai',
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(c),
                      child: const Text('Batal'),
                    ),
                    ElevatedButton(
                      onPressed: () => Navigator.pop(c, payment),
                      child: const Text('Simpan'),
                    ),
                  ],
                ),
              );

              if (result == null) return;

              final sales = await loadSales();
              final no = 'CFC-${(sales.length + 1).toString().padLeft(5, '0')}';
              await saveSale(Sale(
                no,
                DateTime.now().toIso8601String(),
                total,
                result,
              ));

              setState(() => cart.clear());

              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('$no berhasil disimpan')),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              final cats = [
                'Semua',
                ...products.map((p) => p.category).toSet()
              ];
              final shown = products.where((p) =>
                  p.active && (category == 'Semua' || p.category == category));

              return Column(
                children: [
                  SizedBox(
                    height: 55,
                    child: ListView(
                      scrollDirection: Axis.horizontal,
                      padding: const EdgeInsets.symmetric(horizontal: 8),
                      children: cats
                          .map((c) => Padding(
                                padding:
                                    const EdgeInsets.symmetric(horizontal: 4),
                                child: ChoiceChip(
                                  label: Text(c),
                                  selected: category == c,
                                  onSelected: (_) =>
                                      setState(() => category = c),
                                ),
                              ))
                          .toList(),
                    ),
                  ),
                  Expanded(
                    child: ListView(
                      padding: const EdgeInsets.all(12),
                      children: shown
                          .map((p) => Card(
                                child: ListTile(
                                  title: Text(p.name,
                                      style: const TextStyle(
                                          fontWeight: FontWeight.bold)),
                                  subtitle: Text(rp(p.price)),
                                  trailing: IconButton(
                                    icon: const Icon(Icons.add_circle,
                                        color: red, size: 32),
                                    onPressed: () => add(p),
                                  ),
                                ),
                              ))
                          .toList(),
                    ),
                  ),
                  if (cart.isNotEmpty)
                    Container(
                      padding: const EdgeInsets.all(15),
                      decoration: const BoxDecoration(
                        color: Colors.white,
                        boxShadow: [
                          BoxShadow(
                              blurRadius: 8, color: Colors.black12)
                        ],
                      ),
                      child: Column(
                        children: [
                          ...cart.entries.map((e) => Row(
                                mainAxisAlignment:
                                    MainAxisAlignment.spaceBetween,
                                children: [
                                  Text('${e.key} x${e.value}'),
                                  Text(rp(products
                                          .firstWhere(
                                              (p) => p.name == e.key)
                                          .price *
                                      e.value)),
                                ],
                              )),
                          const Divider(),
                          Row(
                            mainAxisAlignment:
                                MainAxisAlignment.spaceBetween,
                            children: [
                              const Text('TOTAL',
                                  style: TextStyle(
                                      fontWeight: FontWeight.bold)),
                              Text(rp(total),
                                  style: const TextStyle(
                                      fontWeight: FontWeight.bold,
                                      fontSize: 20)),
                            ],
                          ),
                          const SizedBox(height: 10),
                          SizedBox(
                            width: double.infinity,
                            child: ElevatedButton(
                              onPressed: checkout,
                              style: ElevatedButton.styleFrom(
                                  backgroundColor: red,
                                  foregroundColor: Colors.white),
                              child: const Text('BAYAR'),
                            ),
                          ),
                        ],
                      ),
                    ),
                ],
              );
            }
          }

          class ReportPage extends StatelessWidget {
            ReportPage({super.key});

            @override
            Widget build(BuildContext context) {
              return FutureBuilder<List<Sale>>(
                future: loadSales(),
                builder: (context, snap) {
                  final sales = snap.data ?? [];
                  final omzet =
                      sales.fold<int>(0, (s, e) => s + e.total);

                  return ListView(
                    padding: const EdgeInsets.all(16),
                    children: [
                      const Text('Laporan Penjualan',
                          style: TextStyle(
                              fontSize: 25, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 15),
                      Card(
                        child: ListTile(
                          title: const Text('Total Omzet'),
                          subtitle: Text('${sales.length} transaksi'),
                          trailing: Text(rp(omzet),
                              style: const TextStyle(
                                  fontWeight: FontWeight.bold)),
                        ),
                      ),
                      const SizedBox(height: 15),
                      ...sales.map((s) => Card(
                            child: ListTile(
                              title: Text(s.no),
                              subtitle: Text('${s.time} • ${s.payment}'),
                              trailing: Text(rp(s.total)),
                            ),
                          )),
                    ],
                  );
                },
              );
            }
          }

          class SettingsPage extends StatelessWidget {
            final String role;
            const SettingsPage({super.key, required this.role});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const Text('Pengaturan',
                      style: TextStyle(
                          fontSize: 25, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 15),
                  Card(
                    child: ListTile(
                      leading: const Icon(Icons.restaurant, color: red),
                      title: const Text('Menu & Harga'),
                      subtitle: const Text('Tambah, ubah, hapus menu'),
                      onTap: () => Navigator.push(
                        context,
                        MaterialPageRoute(
                            builder: (_) => const MenuPage()),
                      ),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: const Icon(Icons.store, color: red),
                      title: const Text('Identitas Toko'),
                      subtitle: const Text('Nama, alamat dan kontak'),
                      onTap: () => showDialog(
                        context: context,
                        builder: (_) => const AlertDialog(
                          title: Text('Identitas Toko'),
                          content: Text(
                              'Colonel Fried Chicken\nPengaturan identitas toko dapat dikembangkan pada versi berikutnya.'),
                        ),
                      ),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: const Icon(Icons.person, color: red),
                      title: const Text('Akun'),
                      subtitle: Text('Login sebagai $role'),
                    ),
                  ),
                  Card(
                    child: ListTile(
                      leading: const Icon(Icons.info, color: red),
                      title: const Text('Tentang'),
                      subtitle: const Text('Colonel Fried Chicken POS V4.0'),
                    ),
                  ),
                ],
              );
            }
          }

          class MenuPage extends StatefulWidget {
            const MenuPage({super.key});
            @override
            State<MenuPage> createState() => _MenuPageState();
          }

          class _MenuPageState extends State<MenuPage> {
            List<Product> products = [];

            @override
            void initState() {
              super.initState();
              loadProducts().then((v) => setState(() => products = v));
            }

            void edit([Product? old]) {
              final name = TextEditingController(text: old?.name ?? '');
              final price = TextEditingController(
                  text: old?.price.toString() ?? '');
              String category = old?.category ?? 'Ayam';

              showDialog(
                context: context,
                builder: (_) => AlertDialog(
                  title: Text(old == null ? 'Tambah Menu' : 'Edit Menu'),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      TextField(
                        controller: name,
                        decoration:
                            const InputDecoration(labelText: 'Nama menu'),
                      ),
                      TextField(
                        controller: price,
                        keyboardType: TextInputType.number,
                        decoration:
                            const InputDecoration(labelText: 'Harga'),
                      ),
                      DropdownButtonFormField<String>(
                        value: category,
                        items: const [
                          DropdownMenuItem(
                              value: 'Ayam', child: Text('Ayam')),
                          DropdownMenuItem(
                              value: 'Paket', child: Text('Paket')),
                          DropdownMenuItem(
                              value: 'Tambahan', child: Text('Tambahan')),
                          DropdownMenuItem(
                              value: 'Minuman', child: Text('Minuman')),
                        ],
                        onChanged: (v) => category = v!,
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(
                        onPressed: () => Navigator.pop(context),
                        child: const Text('Batal')),
                    ElevatedButton(
                      onPressed: () async {
                        if (name.text.trim().isEmpty ||
                            int.tryParse(price.text) == null) return;

                        setState(() {
                          if (old == null) {
                            products.add(Product(
                              name.text.trim(),
                              category,
                              int.parse(price.text),
                            ));
                          } else {
                            old.name = name.text.trim();
                            old.category = category;
                            old.price = int.parse(price.text);
                          }
                        });

                        await saveProducts(products);
                        if (context.mounted) Navigator.pop(context);
                      },
                      child: const Text('Simpan'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Menu & Harga'),
                  backgroundColor: red,
                  foregroundColor: Colors.white,
                ),
                floatingActionButton: FloatingActionButton(
                  backgroundColor: red,
                  foregroundColor: Colors.white,
                  onPressed: () => edit(),
                  child: const Icon(Icons.add),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(12),
                  children: products
                      .map((p) => Card(
                            child: ListTile(
                              title: Text(p.name),
                              subtitle: Text(
                                  '${p.category} • ${rp(p.price)}'),
                              leading: Switch(
                                value: p.active,
                                onChanged: (v) async {
                                  setState(() => p.active = v);
                                  await saveProducts(products);
                                },
                              ),
                              trailing: IconButton(
                                icon: const Icon(Icons.edit),
                                onPressed: () => edit(p),
                              ),
                            ),
                          ))
                      .toList(),
                ),
              );
            }
          }
          DART

      - name: Install dependencies
        run: |
          cd app
          flutter pub get

      - name: Analyze
        run: |
          cd app
          dart analyze lib/main.dart

      - name: Build APK
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colonel-pos-v4-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
